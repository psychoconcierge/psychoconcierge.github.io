<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
        />
        <title>
            Demande d'accès - Faculté de psychologie - Université de
            Strasbourg
        </title>
    </head>
    <body>
        <main class="container">
            <center>
                <img src="logo.png" width="233px" style="margin: 48px" />
                <h1>Demande d'accès</h1>
            </center>

            <form action="https://formspree.io/f/xyzjyqnk" method="POST">
                <label for="Clefs"><strong>Clefs</strong></label>

                <select name="Type de demande" id="demande" required>
                    <option selected disabled value="">
                        Sélectionnez une option
                    </option>
                    <option value="Clé bâtiment + Clé pare feu">Clé bâtiment + Clé pare feu</option>
                    <option value=" Clé LNCA">Clé LNCA</option>
                    <option value="Clé Doctorants / Apprentis">Clé Doctorants / Apprentis</option>
                    <option value="Problème">Problème, à spécifier</option>
                    <option value="Autre">Autre, à spécifier...</option>
                </select>

                <label required name="Précisions" id="Précisions" for="Précisions">
                    <strong>Précisions</strong>
                </label>
                <textarea
                    name="Précisions"
                    id="Précisions"
                    placeholder="Précisez la justification de la demande."
                    required
                ></textarea>

               
                <button type="submit">Transmettre</button>
            </form>
        </main>
    </body>
</html>
